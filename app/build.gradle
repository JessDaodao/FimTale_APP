plugins {
    alias(libs.plugins.android.application)
}

def siteUrl = providers.gradleProperty('fimtaleSiteUrl').getOrElse('https://fimtale.dev')
def apiUrl = providers.gradleProperty('fimtaleApiUrl').getOrElse('https://api.fimtale.dev/api/')
[siteUrl, apiUrl].each { value ->
    def uri = new URI(value)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
        throw new GradleException('FimTale URLs must be absolute HTTPS URLs without credentials, queries or fragments')
    }
}

android {
    buildFeatures { buildConfig true }

    namespace 'com.app.fimtale'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.fimtale"
        minSdk 31
        targetSdk 34
        versionCode 7
        versionName "0.6.0"

        buildConfigField 'String', 'SITE_URL', groovy.json.JsonOutput.toJson(siteUrl.replaceAll('/+$', ''))
        buildConfigField 'String', 'API_URL', groovy.json.JsonOutput.toJson(apiUrl.replaceAll('/+$', '') + '/')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "io.noties.markwon:image:4.6.2"
    implementation "io.noties.markwon:image-glide:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:core:4.6.2"
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
